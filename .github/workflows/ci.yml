name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  # A newer push to a PR cancels that PR's older run; every other run gets its own group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        # pyproject.toml declares pypdf>=5,<7. Running both majors is what makes
        # that range a claim with evidence (docs/PROCESS.md section 2).
        pypdf: ["pypdf>=5,<6", "pypdf>=6,<7"]
    env:
      # A missing PyYAML must fail the overlay checks here, not skip them.
      REQUIRE_HARNESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "${{ matrix.pypdf }}" -r requirements-dev.txt
      - name: Product tests, deterministic checks and harness tests
        run: python -m unittest discover -s tests -v
      - name: Repository layout
        run: python scripts/layout_check.py
      - name: Mutation check
        # Proves the checks named in tests/mutations/ fail when the behavior they guard is removed.
        run: python scripts/mutation_check.py --all
